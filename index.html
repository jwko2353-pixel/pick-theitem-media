<style>
  :root { --bg:#F4EBDD; --paper:#FCF7EE; --ink:#2F4A3A; --muted:#7A7262; --accent:#D9733B; --line:#E0D2BA; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Gowun Dodum",sans-serif; padding:28px 16px 48px; }
  main { max-width:520px; margin:0 auto; }
  .logo { width:72px; height:72px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center;
          font:700 38px "Gaegu",sans-serif; margin:0 auto; position:relative; }
  .logo::after { content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:var(--accent); right:14px; bottom:16px; }
  h1 { font:700 34px "Gaegu",sans-serif; text-align:center; margin-top:12px; }
  .sub { text-align:center; color:var(--muted); margin-top:4px; }
  .ad { margin:20px 0 22px; border:2px dashed var(--ink); border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.5; background:rgba(252,247,238,.7); }
  .ad b { display:inline-block; background:var(--ink); color:#fff; border-radius:3px; padding:0 8px; margin-right:6px; font-weight:400; }
  .card { display:grid; grid-template-columns:auto 76px 1fr; gap:12px; align-items:center; text-decoration:none; color:inherit;
          background:var(--paper); border:2px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; position:relative; }
  .card .no { font:700 26px "Gaegu",sans-serif; color:var(--accent); width:34px; text-align:center; }
  .card img { width:76px; height:76px; object-fit:cover; border-radius:8px; background:#fff; }
  .txt b { display:block; font-size:16px; line-height:1.35; }
  .txt span { display:block; font-size:13px; color:var(--muted); margin-top:3px; }
  .go { grid-column:2 / -1; justify-self:end; font-size:13px; color:var(--accent); margin-top:-4px; }
  .empty { text-align:center; color:var(--muted); padding:32px 0; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; line-height:1.6; }
</style></head>
